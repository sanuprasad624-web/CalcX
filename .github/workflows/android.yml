name: CALCX CI / CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type to assemble (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build & Validate CALCX APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Ensure Build Environment Secrets File
        run: |
          # CALCX core app is 100% offline-first and requires no API key to build or run.
          # Secrets Gradle Plugin checks for .env or .env.example; create .env if absent.
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Determine Build Configuration
        id: build_config
        env:
          INPUT_BUILD_TYPE: ${{ github.event.inputs.build_type }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          VERSION_NAME=$(grep -m1 "versionName" app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.0.0")
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            VERSION_NAME="$TAG_VERSION"
            echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          fi

          if [ "$INPUT_BUILD_TYPE" = "release" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "target_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "build_flavor=release" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "target_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "build_flavor=release" >> "$GITHUB_OUTPUT"
          else
            echo "target_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "build_flavor=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Keystore (If Release Signing Configured)
        if: steps.build_config.outputs.build_flavor == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore/release.jks
          echo "KEYSTORE_PATH=/tmp/keystore/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK with Gradle
        run: |
          ./gradlew ${{ steps.build_config.outputs.target_task }} --stacktrace

      - name: Clean Temporary Signing Keys
        if: always()
        run: |
          rm -rf /tmp/keystore

      - name: Verify and Package APK
        id: package_apk
        run: |
          BUILD_FLAVOR="${{ steps.build_config.outputs.build_flavor }}"
          VERSION_NAME="${{ steps.build_config.outputs.version_name }}"

          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file was found in app/build/outputs/apk!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE" 2>/dev/null || echo 0)
          if [ "$FILE_SIZE" -le 0 ]; then
            echo "::error::Generated APK is empty (0 bytes)!"
            exit 1
          fi

          HUMAN_SIZE=$(du -h "$APK_FILE" | cut -f1)
          SHA256_SUM=$(sha256sum "$APK_FILE" | cut -d ' ' -f1)

          FINAL_APK_NAME="CALCX-v${VERSION_NAME}-${BUILD_FLAVOR}.apk"
          mkdir -p dist
          cp "$APK_FILE" "dist/${FINAL_APK_NAME}"

          echo "apk_path=dist/${FINAL_APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${FINAL_APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${HUMAN_SIZE}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${SHA256_SUM}" >> "$GITHUB_OUTPUT"

          echo "Successfully verified and packaged: dist/${FINAL_APK_NAME} (${HUMAN_SIZE}, SHA256: ${SHA256_SUM})"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_apk.outputs.apk_name }}
          path: ${{ steps.package_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Generate Job Summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # 🧮 CALCX — Build & Release Summary

          **App Name:** CALCX
          **Author Credit:** Made by Aman Prasad
          **Architecture:** 100% Offline-First (Zero API Key Dependency)

          ### 📦 Build Artifact Details
          - **File Name:** `${{ steps.package_apk.outputs.apk_name }}`
          - **File Size:** `${{ steps.package_apk.outputs.apk_size }}`
          - **Flavor:** `${{ steps.build_config.outputs.build_flavor }}`
          - **Version:** `v${{ steps.build_config.outputs.version_name }}`
          - **SHA256:** `${{ steps.package_apk.outputs.apk_sha256 }}`

          ### 🚀 Commit & Trigger Info
          - **Trigger Event:** `${{ github.event_name }}`
          - **Ref / Branch:** `${{ github.ref_name }}`
          - **Commit SHA:** `${{ github.sha }}`

          ---
          *CALCX — Calculate Anything. Understand Everything.*
          EOF

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package_apk.outputs.apk_path }}
          name: CALCX v${{ steps.build_config.outputs.version_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## CALCX v${{ steps.build_config.outputs.version_name }}

            ### 📲 Download Android APK
            Download **`${{ steps.package_apk.outputs.apk_name }}`** below to install CALCX on any modern Android device.

            ### ✨ Features Included:
            - **100% Offline-First**: No internet connection or API keys required.
            - **Interactive 2D Graphing Engine**: Real-time implicit & Cartesian plotting with dynamic pinch-to-zoom axis labels and auto color cycling.
            - **Desmos-Style Keypads**: Dedicated 123 keypad and alphabet keyboard for fast equation and variable input.
            - **Calculus Engine**: Symbolic and numerical differentiation, indefinite & definite integrals.
            - **JEE & Engineering Toolkit**: Matrices, Vectors, Physics formulas & constants, Chemistry periodic data, DateTime, Finance, Statistics, Programmer base conversion, and Unit converter.
            - **Local Notebook & History**: Persistent Room database storage for exam notes and calculation history.

            ---
            **Author:** Made by Aman Prasad
            *Calculate Anything. Understand Everything.*
