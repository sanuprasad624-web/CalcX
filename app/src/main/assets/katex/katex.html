<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="katex.min.css">
    <script src="katex.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: text;
            user-select: text;
        }
        html, body {
            background-color: transparent !important;
            background: transparent !important;
            width: 100%;
            height: auto;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        #math-container {
            display: inline-block;
            white-space: nowrap;
            padding: 2px 4px;
            font-size: 20px;
            color: #ffffff;
            transition: color 0.15s ease;
        }
        .katex {
            font-size: 1.05em;
            line-height: 1.25;
            text-rendering: geometricPrecision;
        }
        .katex-display {
            margin: 0 !important;
            display: inline-block !important;
            text-align: left !important;
        }
        ::-webkit-scrollbar {
            height: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.35);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="math-container"></div>
    <script>
        var pendingRender = null;

        function renderLatex(latexString, colorHex, fontSizePx, isDisplayMode) {
            var container = document.getElementById('math-container');
            if (!container) return;
            if (colorHex) {
                container.style.color = colorHex;
            }
            if (fontSizePx) {
                container.style.fontSize = fontSizePx + 'px';
            }

            if (typeof katex === 'undefined') {
                pendingRender = { latex: latexString, color: colorHex, size: fontSizePx, display: isDisplayMode };
                container.textContent = latexString;
                return;
            }

            try {
                katex.render(latexString, container, {
                    displayMode: (isDisplayMode !== false),
                    throwOnError: false,
                    errorColor: '#ef4444',
                    strict: false,
                    trust: true,
                    output: 'html'
                });
                if (window.AndroidBridge && window.AndroidBridge.onRenderComplete) {
                    var rect = container.getBoundingClientRect();
                    window.AndroidBridge.onRenderComplete(Math.ceil(rect.width), Math.ceil(rect.height));
                }
            } catch (err) {
                container.textContent = latexString;
                if (window.AndroidBridge && window.AndroidBridge.onRenderError) {
                    window.AndroidBridge.onRenderError(err.toString());
                }
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            if (pendingRender) {
                renderLatex(pendingRender.latex, pendingRender.color, pendingRender.size, pendingRender.display);
                pendingRender = null;
            }
        });
    </script>
</body>
</html>
